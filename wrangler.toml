name = "misc-search-gpt-memory"
main = "src/index.ts"
compatibility_date = "2024-07-25"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "gpt-memory-db"
database_id = "8f61e157-4420-4cd3-bc3f-75daec9a492f"
migrations_dir = "drizzle"

[dev]
port = 8787
local_protocol = "http"

[[env.development.d1_databases]]
binding = "DB"
database_name = "gpt-memory-db"
database_id = "8f61e157-4420-4cd3-bc3f-75daec9a492f"
migrations_dir = "drizzle"
