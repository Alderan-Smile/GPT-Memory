openapi: 3.1.0
info:
  title: GPT Memory API
  description: |
    REST API for persistent memory management of tabletop RPG campaigns.

    Supports thousands of independent campaigns. All entities are scoped to a campaign via `campaignId`.
    All responses are JSON. Soft-delete is enforced across all entities.
  version: 1.0.0
  contact:
    name: GPT Memory

servers:
  - url: https://core-gpt-memory.jokertcnr.workers.dev
    description: Production core
  - url: https://world-building-gpt-memory.jokertcnr.workers.dev
    description: Production world building
  - url: https://vehicles-quipment-gpt-memory.jokertcnr.workers.dev
    description: Production vehicles & equipment
  - url: https://narrative-gpt-memory.jokertcnr.workers.dev
    description: Production narrative
  - url: https://knowledge-gpt-memory.jokertcnr.workers.dev
    description: Production knowledge
  - url: https://misc-search-gpt-memory.jokertcnr.workers.dev
    description: Production miscellaneous search

tags:
  - name: Health
  - name: Campaigns
  - name: Characters
  - name: Locations
  - name: Planets
  - name: StarSystems
  - name: Organizations
  - name: Ships
  - name: Vehicles
  - name: Objects
  - name: Events
  - name: Timeline
  - name: Relationships
  - name: Secrets
  - name: PlayerKnowledge
  - name: WorldKnowledge
  - name: Quotes
  - name: Notes
  - name: Sessions
  - name: Search
  - name: Context

components:
  schemas:
    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        hasNext: { type: boolean }
        hasPrev: { type: boolean }

    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }

    ListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/Pagination'

    ItemResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: {}

paths:

  /health:
    get:
      operationId: healthCheck
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      status: { type: string, example: ok }
                      timestamp: { type: string, format: date-time }
                      version: { type: string }

  /api/campaigns:
    get:
      operationId: listCampaigns
      tags: [Campaigns]
      summary: List all campaigns
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: q
          schema: { type: string }
          description: Search by name
      responses:
        '200':
          description: List of campaigns with pagination
    post:
      operationId: createCampaign
      tags: [Campaigns]
      summary: Create a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                metadata: { type: object }
      responses:
        '201':
          description: Campaign created

  /api/campaigns/{id}:
    get:
      operationId: getCampaign
      tags: [Campaigns]
      summary: Get a campaign by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Campaign found
        '404':
          description: Campaign not found
    patch:
      operationId: updateCampaign
      tags: [Campaigns]
      summary: Update a campaign
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaignId]
              properties:
                campaignId: { type: string }
                name: { type: string }
                description: { type: string }
                metadata: { type: object }
      responses:
        '200':
          description: Campaign updated
    delete:
      operationId: deleteCampaign
      tags: [Campaigns]
      summary: Soft-delete a campaign
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Campaign deleted

  /api/characters:
    get:
      operationId: listCharacters
      tags: [Characters]
      summary: List characters in a campaign
      parameters:
        - in: query
          name: campaignId
          required: true
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: status
          schema: { type: string, enum: [alive, dead, unknown, missing] }
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: Paginated list of characters
    post:
      operationId: createCharacter
      tags: [Characters]
      summary: Create a character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaignId, name]
              properties:
                campaignId: { type: string }
                name: { type: string }
                aliases: { type: array, items: { type: string } }
                species: { type: string }
                gender: { type: string }
                birth: { type: string }
                death: { type: string }
                status: { type: string, enum: [alive, dead, unknown, missing], default: alive }
                organization: { type: string }
                rank: { type: string }
                currentPlanet: { type: string }
                currentLocation: { type: string }
                description: { type: string }
                emotionalState: { type: string }
                trust: { type: number }
                respect: { type: number }
                friendship: { type: number }
                fear: { type: number }
                curiosity: { type: number }
                anger: { type: number }
                love: { type: number }
                hate: { type: number }
                debt: { type: number }
      responses:
        '201':
          description: Character created

  /api/characters/{id}:
    get:
      operationId: getCharacter
      tags: [Characters]
      summary: Get a character
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: campaignId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Character found
        '404':
          description: Not found
    patch:
      operationId: updateCharacter
      tags: [Characters]
      summary: Update a character
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaignId]
              properties:
                campaignId: { type: string }
                name: { type: string }
                status: { type: string, enum: [alive, dead, unknown, missing] }
                description: { type: string }
                currentLocation: { type: string }
                emotionalState: { type: string }
                trust: { type: number }
                respect: { type: number }
                friendship: { type: number }
                fear: { type: number }
      responses:
        '200':
          description: Character updated
    delete:
      operationId: deleteCharacter
      tags: [Characters]
      summary: Soft-delete a character
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: campaignId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Character deleted

